<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Psychopomp</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #000000;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--false fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
// ============================================================================
// CHUNK LOADER - PsychoPomp
// ----------------------------------------------------------------------------
// index.pck is 179,406,072 bytes and is split into 8 chunks of 22,425,759
// bytes each (index.pck.part1 .. index.pck.part8). This page fetches every
// part IN ORDER, concatenates the bytes, and hands the assembled pack to the
// engine through its buffer API (preloadFile + --main-pack).
//
// Keep ALL files together in the SAME folder/host as this page:
//   index.js, index.wasm, index.service.worker.js, index.offline.html,
//   index.manifest.json, the icons/worklets, and the 8 index.pck.partN files.
//
// No server headers are required: the export's service worker
// (index.service.worker.js) injects cross-origin isolation on any HTTPS
// host, so plain static hosts (e.g. GitHub Pages) work.
// ============================================================================
const LOADER_PARTS = [
	"index.pck.part1",
	"index.pck.part2",
	"index.pck.part3",
	"index.pck.part4",
	"index.pck.part5",
	"index.pck.part6",
	"index.pck.part7",
	"index.pck.part8",
];
// ============================================================================

const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":179406072,"index.wasm":56194770},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = true;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	function fetchAndAssembleParts(parts) {
		const total = Number(Object(GODOT_CONFIG.fileSizes)['index.pck']) || 0;
		if (total > 0) {
			statusProgress.value = 0;
			statusProgress.max = total;
		}
		let loaded = 0;
		const buffers = [];
		const chain = parts.reduce(function (promise, url, i) {
			return promise.then(function () {
				return fetch(url).then(function (response) {
					if (!response.ok) {
						throw new Error("Failed to load part " + (i + 1) + ' of ' + parts.length + ': ' + url + ' (HTTP ' + response.status + ')');
					}
					return response.arrayBuffer();
				}).then(function (buf) {
					loaded += buf.byteLength;
					if (total > 0) {
						statusProgress.value = loaded;
					}
					buffers.push(buf);
				});
			});
		}, Promise.resolve());
		return chain.then(function () {
			const pck = new Uint8Array(loaded);
			let offset = 0;
			buffers.forEach(function (buf) {
				pck.set(new Uint8Array(buf), offset);
				offset += buf.byteLength;
			});
			return pck.buffer;
		});
	}

	function bootGame(pckBuffer) {
		engine.config.args = ['--main-pack', 'index.pck'];
		return engine.init('index').then(function () {
			return engine.preloadFile(pckBuffer, 'index.pck');
		}).then(function () {
			return engine.start();
		});
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		fetchAndAssembleParts(LOADER_PARTS).then(bootGame).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
